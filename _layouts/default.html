<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    {% include head-custom.html %}
  </head>
  <body class="gradient">
    <div class="">
      <div class="container">
        <div class="row justify-content-center text-xl-start text-center gx-4 pt-4 ">
          <div class="col-4 d-flex d-xl-none mt-2 pt-2">
            <img class="img-fluid rounded-circle py-auto" style="max-height: 15rem;" src="./assets/img/myself.jpg" 
              alt="Picture of Ajinkya Bhole."/>
          </div>
          <div class="col-10 col-xl-5 mt-2 pt-4 header d-flex flex-column">
            <div class="row">
              <div class="col-12">
                <h1 class="inter-banner"> Ajinkya Bhole </h1>
              </div>
            </div>
            <div class="row mt-2">
              <!-- <div class="col-12">
                <h4 class="subhead">PhD Student in Systems and Control, <br/> Ghent University</a> </h4>
              </div> -->
              <div class="col-12 tagline">
                <em>I enjoy animating inanimate thingies! </em>
                <img src="./assets/img/walle.gif" alt="Wall‑E" style="height:1em; vertical-align:middle; margin-left:0.4rem;" />
              </div>
            </div>
            <div class="row links my-auto justify-content-center justify-content-xl-start">
              {% include links.html %}
            </div>
            <div class="row">
              <div class="col-12 header-quote text-center mt-1">
                <blockquote class="mb-0">“I tell you, we are here on Earth to fart around, and don't let anybody tell you different.”</blockquote>
                <small class="text-muted">― Kurt Vonnegut</small>
              </div>
            </div>
          </div>
          <div class="col-3 d-none d-xl-inline-block mt-2 pt-2">
            <img class="img-fluid rounded-circle py-auto" style="max-height: 15rem;" src="./assets/img/myself.jpg" 
              alt="Picture of Ajinkya Bhole."/>
          </div>
        </div>
      </div> 
    </div>
    <main class="container">
      <div class="row justify-content-center">
        <div class="col-10 col-xl-8">
          <hr />
        </div>
      </div>
      <div class="row justify-content-center">
        {{ content }}
      </div>
    </main>
      {% include footer.html %}
    
      <script src="assets/js/content_switch.js"></script>
  </body>
</html>
